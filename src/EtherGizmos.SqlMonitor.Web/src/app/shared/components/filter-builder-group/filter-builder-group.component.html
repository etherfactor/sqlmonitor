<ng-container *ngIf="isFilterGroup(filter)">
  <div>
    <ng-select [(ngModel)]="filter.operator"
               [clearable]="false"
               [selectOnTab]="true"
               style="width: 100px;">
      <ng-option value="and">And</ng-option>
      <ng-option value="or">Or</ng-option>
    </ng-select>
  </div>
  <div class="d-flex flex-row" style="position: relative;">
    <div style="width: 30px; position: relative;">
      <div style="position: relative; left: 50%; transform: translateX(-50%); width: 2px; background-color: var(--bs-body-color); height: calc(100%); top: 0px;"></div>
    </div>
    <div class="w-100">
      <ng-container *ngFor="let condition of conditions; let i = index">
        <div class="offshoot">
          <filter-builder-group [(filter)]="conditions[i]"
                                [properties]="properties"></filter-builder-group>
        </div>
      </ng-container>
    </div>
  </div>
  <div>
    <a href="javascript:void(0);">
      <span class="bi bi-plus-square"></span>
      Add
    </a>
  </div>
</ng-container>
<ng-container *ngIf="!isFilterGroup(filter)">
  <div class="container-fluid" style="padding: 0;">
    <div class="row">
      <div class="col-auto-md">
        <ng-select [(ngModel)]="filter.property"
                   [clearable]="false"
                   [selectOnTab]="true"
                   class="auto-grow">
          <ng-option *ngFor="let property of properties" [value]="property.name">{{property.displayName}}</ng-option>
        </ng-select>
      </div>
      <div class="col-md-auto">
        <ng-select [(ngModel)]="filter.operator"
                   [clearable]="false"
                   [selectOnTab]="true"
                   class="auto-grow">
          <ng-option *ngFor="let operator of getOperators()" [value]="operator">{{getOperatorDisplayName(operator)}}</ng-option>
        </ng-select>
      </div>
      <div class="col-md-auto">
        <ng-container [ngSwitch]="selectedProperty.type">
          <input-luxon-datetime *ngSwitchCase="'datetime'" [(ngModel)]="filter.value" style="width: 200px;"></input-luxon-datetime>
          <input *ngSwitchCase="'guid'" type="text" class="form-control" [(ngModel)]="filter.value" style="width: 200px;" />
          <input *ngSwitchCase="'number'" type="number" class="form-control" [(ngModel)]="filter.value" style="width: 200px;" />
          <input *ngSwitchCase="'string'" type="text" class="form-control" [(ngModel)]="filter.value" style="width: 200px;" />
        </ng-container>
      </div>
    </div>
