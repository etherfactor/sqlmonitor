<!-- Filter group -->
<ng-container *ngIf="isFilterGroup(filter)">
  <div class="container-fluid">
    <div class="row">
      <div class="col-auto">
        <ng-select [(ngModel)]="filter.operator"
                   [clearable]="false"
                   [selectOnTab]="true"
                   style="width: 100px;">
          <ng-option value="and">And</ng-option>
          <ng-option value="or">Or</ng-option>
        </ng-select>
      </div>
    </div>
    <div class="row">
      <div class="col-auto">
        <!--<span class="bi bi-circle"></span>-->
        <div class="h-100" style="position: relative; margin-left: 10px; width: 10px;">
          <div style="position: absolute; left: 50%; transform: translateX(-50%); width: 2px; background-color: var(--bs-body-color); height: calc(100% - 16px); top: 0px;"></div>
        </div>
      </div>
      <div class="col">
        <div *ngFor="let condition of conditions; let i = index" class="row offshoot" style="position: relative;">
          <div class="col">
            <filter-builder-group [(filter)]="conditions[i]"
                                  [properties]="properties"></filter-builder-group>
          </div>
          <button *ngIf="conditions.length > 1" class="btn btn-link" style="position: absolute; right: 0; width: fit-content;" (click)="removeCondition(i)">
            <span class="bi bi-x-lg"></span>
          </button>
        </div>
        <div class="row offshoot">
          <div class="dropdown col">
            <a class="dropdown-toggle d-block" style="margin-top: 7px; margin-bottom: 7px; width: fit-content;" href="javascript:void(0);" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="bi bi-plus-square">Add</span>
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="javascript:void(0);" (click)="addGroup()">Group</a></li>
              <li><a class="dropdown-item" href="javascript:void(0);" (click)="addProperty()">Property</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<!-- Filter property -->
<ng-container *ngIf="!isFilterGroup(filter)">
  <div class="container-fluid" style="padding: 0; width: calc(100% - 32px); display: inline-block;">
    <div class="row">
      <div class="col-md-auto">
        <ng-select [(ngModel)]="filter.property"
                   [clearable]="false"
                   [selectOnTab]="true"
                   class="auto-grow">
          <ng-option *ngFor="let property of properties" [value]="property.name">{{property.displayName}}</ng-option>
        </ng-select>
      </div>
      <div class="col-md-auto">
        <ng-select [(ngModel)]="filter.operator"
                   [clearable]="false"
                   [selectOnTab]="true"
                   class="auto-grow">
          <ng-option *ngFor="let operator of getOperators()" [value]="operator">{{getOperatorDisplayName(operator)}}</ng-option>
        </ng-select>
      </div>
      <div class="col-md">
        <ng-container [ngSwitch]="selectedProperty?.type ?? 'string'">
          <input-luxon-datetime *ngSwitchCase="'datetime'" [(ngModel)]="filter.value"></input-luxon-datetime>
          <input *ngSwitchCase="'guid'" type="text" class="form-control" [(ngModel)]="filter.value" />
          <input *ngSwitchCase="'number'" type="number" class="form-control" [(ngModel)]="filter.value" />
          <input *ngSwitchCase="'string'" type="text" class="form-control" [(ngModel)]="filter.value" />
        </ng-container>
      </div>
    </div>
  </div>
</ng-container>
