<div class="box mt-3">
  <ng-container *ngTemplateOutlet="link ? contentLink : content"></ng-container>
</div>

<ng-template #content>
  <div class="box-title mt-2 d-flex align-items-center">
    <span class="bi {{icon}} fs-3"></span>
    <h5 class="ms-2">{{title}}</h5>
  </div>

  <ng-content></ng-content>

  <div class="position-relative">
    <div class="d-flex justify-content-between align-items-center mt-3">
      <ng-container *ngIf="isLoading || statuses.length === 0">
        <span class="badge text-bg-info" style="visibility: hidden;">PH</span>
      </ng-container>
      <ng-container *ngIf="!isLoading">
        <span *ngFor="let status of statuses" class="badge text-bg-{{status.color}}" [ngbTooltip]="status.tooltip">{{status.label}}: {{status.count}}</span>
      </ng-container>
    </div>
    <div class="progress mt-3" style="height: 8px;">
      <ng-container *ngIf="!isLoading">
        <div *ngFor="let status of statuses" class="progress-bar bg-{{status.color}}" role="progressbar" [style]="{ width: (100 * status.count / totalCount) + '%' }" [attr.aria-valuenow]="100 * status.count / totalCount" aria-valuemin="0" aria-valuemax="100"></div>
      </ng-container>
    </div>
    <div *ngIf="isLoading" class="w-100 h-100 position-absolute d-flex justify-content-center align-items-center" style="top: 0%; left: 0%;">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #contentLink>
  <a class="nostyle" [routerLink]="link">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </a>
</ng-template>
