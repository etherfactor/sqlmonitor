<div class="modal-header">
  <h5 class="modal-title">
    Editing Chart Widget
  </h5>
</div>
<div class="modal-body pt-0">
  <div class="container-fluid">

    <mat-stepper orientation="vertical" #stepper>
      <ng-template matStepperIcon="edit"><i class="bi bi-check-lg"></i></ng-template>
      <ng-template matStepperIcon="done"><i class="bi bi-check-lg"></i></ng-template>
      <ng-template matStepperIcon="error"><i class="bi bi-exclamation-triangle"></i></ng-template>

      <mat-step [stepControl]="firstFormGroup" errorMessage="No">
        <form [formGroup]="firstFormGroup">
          <ng-template matStepLabel>Step 1</ng-template>
          <label>Name</label>
          <input placeholder="Last name, First name" formControlName="firstCtrl" required>
          <div>
            <button mat-button matStepperNext>Next</button>
          </div>
        </form>
      </mat-step>
      <mat-step [stepControl]="secondFormGroup" errorMessage="No">
        <form [formGroup]="secondFormGroup">
          <ng-template matStepLabel>Step 2</ng-template>
          <label>Address</label>
          <input formControlName="secondCtrl" placeholder="Ex. 1 Main St, New York, NY"
                 required>
          <div>
            <button mat-button matStepperPrevious>Back</button>
            <button mat-button matStepperNext>Next</button>
          </div>
        </form>
      </mat-step>
      <mat-step state="number">
        <ng-template matStepLabel>Done</ng-template>
        <p>You are now done.</p>
        <div>
          <button mat-button matStepperPrevious>Back</button>
          <button mat-button (click)="stepper.reset()">Reset</button>
        </div>
      </mat-step>
    </mat-stepper>

  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()"><span class="bi bi-x-lg"></span> Cancel</button>
  <button type="button" class="btn btn-primary" (click)="trySubmit()"><span class="bi bi-check-lg"></span> OK</button>
</div>
