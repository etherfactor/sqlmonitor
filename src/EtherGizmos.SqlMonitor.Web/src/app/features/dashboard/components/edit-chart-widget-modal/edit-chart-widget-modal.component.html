<div class="modal-header">
  <h5 class="modal-title">
    Editing Chart Widget
  </h5>
</div>
<div class="modal-body pt-0">
  <div class="container-fluid">

    <mat-stepper #stepper orientation="vertical" [linear]="true" class="mt-3" [formGroup]="chartConfigurationForm">
      <ng-template matStepperIcon="edit"><i class="bi bi-check-lg"></i></ng-template>
      <ng-template matStepperIcon="done"><i class="bi bi-check-lg"></i></ng-template>
      <ng-template matStepperIcon="error"><i class="bi bi-exclamation-triangle"></i></ng-template>

      <mat-step [completed]="step1Valid()" errorMessage="Missing required fields">
        <ng-template matStepLabel>Select Chart Type</ng-template>

        <edit-chart-widget-chart-selector formControlName="chartType"></edit-chart-widget-chart-selector>

        <div class="d-flex justify-content-end mt-3" style="gap: 15px;">
          <button class="btn btn-primary" matStepperNext [disabled]="!step1Valid()">Next</button>
        </div>
      </mat-step>
      <mat-step [stepControl]="secondFormGroup" errorMessage="Missing required fields">
        <ng-template matStepLabel>Configure Metrics</ng-template>

        <div class="row">
          <div class="col-12 mt-3">
            <div class="row">
              <label for="groupName" class="col-sm-3 col-form-label">Metric</label>
              <div class="col-sm-9">
                <ng-select>
                  <ng-option *entitySearch="metricSet; filter filterMetrics; let record" [value]="record.id">
                    {{record.name}}
                  </ng-option>
                </ng-select>
              </div>
            </div>
          </div>
        </div>
        
        <div class="d-flex justify-content-end mt-3" style="gap: 15px;">
          <button class="btn btn-secondary" matStepperPrevious>Back</button>
          <button class="btn btn-primary" matStepperNext>Next</button>
        </div>
      </mat-step>
      <mat-step state="number">
        <ng-template matStepLabel>Done</ng-template>
        <p>You are now done.</p>
        <div class="d-flex justify-content-end mt-3" style="gap: 15px;">
          <button class="btn btn-secondary" matStepperPrevious>Back</button>
        </div>
      </mat-step>
    </mat-stepper>

  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()"><span class="bi bi-x-lg"></span> Cancel</button>
  <button type="button" class="btn btn-primary" (click)="trySubmit()" [disabled]="!formValid()"><span class="bi bi-check-lg"></span> OK</button>
</div>
