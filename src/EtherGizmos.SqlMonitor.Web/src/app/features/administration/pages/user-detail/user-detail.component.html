<ng-container *ngIf="isLoading">
  <div style="position: fixed; top: 0; left: 0; height: 100%; width: 100%; background-color: color-mix(in srgb, var(--bs-body-bg) 50%, transparent); z-index: 100;">
  </div>
  <div style="position: fixed; top: 50%; left: 50%; transform: translateX(-50%) translateY(-50%); z-index: 100;">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="form" [formGroup]="form">
  <div class="row">
    <div class="col-12 mt-3">
      <h4>Edit User</h4>
      <div class="text-muted">Edit details of one of the users in your environment.</div>
    </div>
  </div>

  <div class="box mt-3">
    <div class="box-title mt-2 d-flex align-items-center">
      <span class="bi bi-diagram-3 fs-3"></span>
      <h5 class="ms-2">User Information</h5>
    </div>
    <div class="row">
      <div class="col-md-6 mt-3">
        <div class="row">
          <label for="userName" class="col-sm-4 col-form-label">Name</label>
          <div class="col-sm-8">
            <input id="userName" type="text" [class]="isEditing ? 'form-control' : 'form-control-plaintext'" [readonly]="!isEditing" formControlName="name" />
          </div>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="row">
          <label for="userIsActive" class="col-sm-4 col-form-label">Is active?</label>
          <div class="col-sm-8">
            <ng-select id="userIsActive"
                       formControlName="isActive"
                       [clearable]="false"
                       [selectOnTab]="true"
                       [class]="isEditing ? '' : 'plaintext'">
              <ng-option [value]="true">Active</ng-option>
              <ng-option [value]="false">Inactive</ng-option>
            </ng-select>
          </div>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="row">
          <label for="userUsername" class="col-sm-4 col-form-label">Username</label>
          <div class="col-sm-8">
            <input id="userUsername" type="text" [class]="isEditing ? 'form-control' : 'form-control-plaintext'" [readonly]="!isEditing" formControlName="username" />
          </div>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="row">
          <label for="userEmailAddress" class="col-sm-4 col-form-label">Email address</label>
          <div class="col-sm-8">
            <input id="userEmailAddress" type="text" [class]="isEditing ? 'form-control' : 'form-control-plaintext'" [readonly]="!isEditing" formControlName="emailAddress" />
          </div>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="row">
          <label for="userPassword" class="col-sm-4 col-form-label">Password</label>
          <div class="col-sm-8">
            <input id="userPassword" type="password" [class]="isEditing ? 'form-control' : 'form-control-plaintext'" [readonly]="!isEditing" formControlName="password" />
          </div>
        </div>
      </div>
      <div class="col-md-6 mt-3">
        <div class="row">
          <label for="userPasswordChanged" class="col-sm-4 col-form-label">Last changed at</label>
          <div class="col-sm-8">
            <input-luxon-datetime id="userPasswordChanged" class="col-sm-4 col-form-label" [readonly]="true" formControlName="lastPasswordChangeAt"></input-luxon-datetime>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="box mt-3">
    <div class="box-title mt-2 d-flex align-items-center">
      <span class="bi bi-diagram-3 fs-3"></span>
      <h5 class="ms-2">Metadata</h5>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="row mt-3">
          <label for="userCreatedAt" class="col-sm-4 col-form-label">Created at</label>
          <div class="col-sm-8">
            <input-luxon-datetime id="userCreatedAt" class="col-sm-4 col-form-label" [readonly]="true" formControlName="createdAt"></input-luxon-datetime>
          </div>
        </div>
        <div class="row mt-3">
          <label for="userCreatedBy" class="col-sm-4 col-form-label">Created by</label>
          <div class="col-sm-8">
            <input id="userCreatedBy" type="text" readonly class="form-control-plaintext" formControlName="createdByUserId" />
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="row mt-3">
          <label for="userModifiedAt" class="col-sm-4 col-form-label">Modified at</label>
          <div class="col-sm-8">
            <ng-container *ngIf="form.controls.modifiedAt.value; else noModifiedAt">
              <input-luxon-datetime id="userModifiedAt" class="col-sm-4 col-form-label" [readonly]="true" formControlName="modifiedAt"></input-luxon-datetime>
            </ng-container>
            <ng-template #noModifiedAt>
              <input id="userModifiedAt" type="text" readonly class="form-control-plaintext" value="Never" />
            </ng-template>
          </div>
        </div>
        <div class="row mt-3">
          <label for="userModifiedBy" class="col-sm-4 col-form-label">Modified by</label>
          <div class="col-sm-8">
            <ng-container *ngIf="form.controls.modifiedByUserId.value; else noModifiedBy">
              <input id="userModifiedBy" type="text" readonly class="form-control-plaintext" formControlName="modifiedByUserId" />
            </ng-container>
            <ng-template #noModifiedBy>
              <input id="userModifiedBy" type="text" readonly class="form-control-plaintext" value="Never" />
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
