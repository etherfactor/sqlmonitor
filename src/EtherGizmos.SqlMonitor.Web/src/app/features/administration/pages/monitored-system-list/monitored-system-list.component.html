<div class="top-spacer"></div>

<h4 class="mt-3" style="font-weight: bold;">
  Monitored Systems List
</h4>

<div class="top-spacer"></div>

<app-table [data]="records" [minRows]="perPage" [sort]="activeSort" (sortChange)="onSortChange($event)" (filterChange)="onFilterChange($event)">
  <ng-template #headers>
    <th app-table-header="name" type="string" [sortable]="true" [filterable]="true">Name</th>
    <th app-table-header="isActive" type="boolean" [sortable]="true" [filterable]="true">Active?</th>
    <th app-table-header="createdAt" type="datetime" [sortable]="true" [filterable]="true">Created at</th>
    <th>Actions</th>
  </ng-template>

  <ng-template #rows let-row>
    <td>{{row.name}}</td>
    <td>{{row.isActive ? 'Active' : 'Inactive'}}</td>
    <td>{{row.createdAt.startOf('minute').toLocaleString({ weekday: 'short', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' })}}</td>
    <td><a [routerLink]="['/admin/system/', row.id]">Edit</a></td>
  </ng-template>
</app-table>
